     <script>
        async function redirectToStore() {
	    // Parse the query string to get the invitation code
            const urlParams = new URLSearchParams(window.location.search);
            const invitationCode = urlParams.get('invitationCode');
            console.log('Received invitation code:', invitationCode);
            // const fibPayment = urlParams.get('fibPayment');
            // console.log('Received fib payment:', fibPayment);
			// console.log('Condition normal case - not FIB Payment');
			
	    	// prepare the userAgent
            	var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            	// Check if the user is on Android
            	if (/android/i.test(userAgent)) {
			console.log('Condition normal case - not FIB Payment - Android');
			if (invitationCode !== undefined && invitationCode !== null && invitationCode !== '') {
			        window.location.href = 'https://play.google.com/store/apps/details?id=tech.isystems.kamo&referrer=invitationCode=' + invitationCode;
			}
                	else {
				window.location.href = 'https://play.google.com/store/apps/details?id=tech.isystems.kamo';
			}
            	}
            	// Check if the user is on iOS
            	else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
			console.log('Condition normal case - not FIB Payment - iOS');
			if (invitationCode !== undefined && invitationCode !== null && invitationCode !== '') {
                		window.location.href = 'https://apps.apple.com/us/app/kamo-%DA%A9%D8%A7%D9%85%DB%86-speed-camera/id6450489920?invitationCode=' + invitationCode;
			}
			else {
				window.location.href = 'https://apps.apple.com/us/app/kamo-%DA%A9%D8%A7%D9%85%DB%86-speed-camera/id6450489920';
			}
            	}
            	// If neither, you can redirect to a generic page or show an alert
            	else {
			console.log('Condition normal case - not FIB Payment - Web');
                	// alert("This app is only available for Android and iOS devices - you might be on windows.");
                	<!-- location.href="https://isys10devsection.net/applinkHomepageNew.aspx"; -->
	        	location.href="https://isystemsdevops.github.io/Kamo_Files/AppLink/AppLinkWeb.html";
            	}
        }
    </script>
